<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeltrainer Englisch</title>
<meta name="theme-color" content="#012169">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-uk-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#0d1b36;--muted:#5d6880;--line:#e1e6ef;--soft:#edf1f7;
  --acc:#012169;--acc-ink:#fff;--acc-soft:#e2e8f5;--bad:#c8102e;--bad-soft:#fbe5e8;--ok:#17855a;--ok-soft:#dff2e8;
  --red:#c8102e;--warn:#b7791f;--shadow:0 1px 2px rgba(1,33,105,.05),0 6px 20px rgba(1,33,105,.06);
  --r:16px;--disp:'Plus Jakarta Sans',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1020;--card:#141b2d;--ink:#e8ecf4;--muted:#97a1b5;--line:#252f47;--soft:#1b2439;
  --acc:#8ba6f2;--acc-ink:#0a1230;--acc-soft:#1c2a52;--bad:#f27186;--bad-soft:#3b1821;--ok:#5fd39b;--ok-soft:#163427;--red:#e2425c;--shadow:none;}}
@media (prefers-color-scheme:dark){.hero{background:#15297a;color:#fff}.hero .btn.pri{background:#fff;color:#012169;border-color:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 96px}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;letter-spacing:-.02em}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px}
h3{font-size:18px}
.top{display:flex;align-items:center;gap:10px;padding:22px 0 14px}
.top .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:var(--acc);color:var(--acc-ink);border:none;padding:20px 20px 24px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--red);box-shadow:0 -2px 0 #fff}
.hero .big{font-family:var(--disp);font-size:54px;line-height:1;font-weight:800;letter-spacing:-.03em}
.hero .sub{color:inherit;opacity:.85}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.hero .btn.pri{background:var(--acc-ink);color:var(--acc);border-color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.icon{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:inline-grid;place-items:center;font-size:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;min-height:40px}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--ink);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:9px;padding:9px 6px;font-size:15px;min-height:42px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:var(--shadow)}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;font-weight:700}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:18px;min-height:50px}
textarea.t{min-height:80px;resize:vertical;font-size:16px}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:60px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}
.li .en{font-weight:700}
.li .de{color:var(--muted);font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.l{background:var(--warn)}.dot.s{background:var(--ok)}
.bar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:var(--soft);margin-top:6px}
.bar i{display:block;height:100%}
.bar .s{background:var(--ok)}.bar .l{background:var(--warn)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs[hidden]{display:none}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabs button{border:none;background:none;padding:8px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.tabs button b{font-size:21px;line-height:1.2;font-weight:400}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs .plus b{background:var(--red);color:#fff;width:40px;height:30px;border-radius:12px;display:grid;place-items:center;font-weight:700}
/* session */
.ses{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:16px}
.in-ses #app{padding-bottom:0}
/* Übung fest an den sichtbaren Bildschirm heften (iOS-Home-Bildschirm rechnet 100vh falsch) */
.ses>*{flex-shrink:0}
.in-ses .ses{position:fixed;top:0;left:0;right:0;bottom:0;min-height:0;max-width:560px;margin:0 auto;padding:0 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;box-shadow:var(--shadow);margin:14px 0}
.qcard .lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.qcard .q{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;font-size:32px;line-height:1.15;margin:14px 0 6px;word-break:break-word}
.qcard .a{font-size:24px;font-weight:700;color:var(--acc);margin-top:14px;word-break:break-word}
.qcard .x{font-size:15px;color:var(--muted);margin-top:10px;font-style:italic}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:18px;text-align:left;min-height:56px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.mid{background:var(--soft);color:var(--warn)}
.xrow{padding:8px 0;border-top:1px dashed var(--line)}
.xrow .xi{min-height:38px;font-size:15px;padding:6px 10px;border-radius:10px}
.xrow.miss .xi:placeholder-shown{border-color:var(--warn);background:var(--bad-soft)}
.xrow.off{opacity:.45}
#pltx .tw{border-radius:6px;padding:1px 2px;cursor:pointer}
.tv{background:var(--acc-soft);color:var(--acc);font-weight:700;border-radius:6px}
#pltx .tw.cur{background:var(--acc);color:var(--acc-ink)}
.fb span{font-weight:400;color:var(--ink)}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rate .btn{padding:12px 6px}
.play{width:96px;height:96px;border-radius:50%;border:none;background:var(--acc);color:var(--acc-ink);font-size:38px;margin:6px auto;display:grid;place-items:center}
.spacer{flex:1}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:15px;max-width:90vw;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}
.center{text-align:center}
.pad{padding:40px 10px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.corr{font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.corr s{color:var(--muted)}
.hint{font-size:14px;color:var(--warn);margin-top:6px}
.segbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segbtn .opt{font-size:16px;padding:10px 12px;min-height:50px}
.segbtn .opt .c{float:right;font-size:13px;color:var(--muted)}
.opt.sug{border-color:var(--acc)}
</style>
</head>
<body>
<div id="app"><div class="center pad muted">Lade deine Vokabeln …</div></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="home"><b>⌂</b>Start</button>
  <button data-tab="practice"><b>▶</b>Üben</button>
  <button data-tab="add" class="plus"><b>+</b>Neu</button>
  <button data-tab="lessons"><b>☰</b>Stunden</button>
  <button data-tab="more"><b>⋯</b>Mehr</button>
</div></nav>
<div id="sheets"></div>
<script src="pocketbase.umd.js"></script>
<script>
'use strict';
const APP_VERSION='1.20.0 (06.11.2026)';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5, INT=[0,1,3,7,14,30,60,120];
const clone=o=>JSON.parse(JSON.stringify(o??null));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const fmtDate=iso=>iso?iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4):'';
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const S={lessons:{},progress:{},meta:{},recs:{},tts:{},needLogin:false,dirty:new Set(),tab:'home',view:null,ses:null,ready:false,error:null,addLid:null,lastAdded:[]};
const DEF={prefer:'teacher',voice:'en-GB',autoplay:true,autoNext:false,len:20,mode:'mix',dir:'mix',focus:'due',newPerDay:10};
const TOPICS=[['tech','🔧','Technik & Kabel'],['sales','🤝','Vertrieb & Kunden'],['talk','💬','Meetings & Kommunikation'],['econ','📊','Zahlen & Wirtschaft'],['travel','✈️','Reisen & Verkehr'],['sport','🏃','Sport & Freizeit'],['people','🙂','Gefühle & Charakter'],['society','🏛️','Gesellschaft & Politik'],['daily','🏠','Alltag & Allgemeines'],['phrases','🧩','Sätze & Grammatik']];
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t[0],{id:t[0],icon:t[1],name:t[2]}]));
const set=()=>Object.assign({},DEF,S.meta.settings||{});

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='err'?4500:2200)}

/* ---------- data layer (PocketBase) – only place that talks to the server ---------- */
const pb=new PocketBase(location.origin);pb.autoCancellation(false);
const ttsText=en=>String(en||'').replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim();
const Store={
  ids:{lessons:{},progress:{},meta:{}},qs:{},timers:{},fileToken:null,fileTokenAt:0,
  async init(){
    if(!pb.authStore.isValid){S.needLogin=true;render();return}
    if(!this.fresh)try{await pb.collection('users').authRefresh()}catch(e){
      if(e&&e.status>=400&&e.status<500){pb.authStore.clear();S.needLogin=true;render();return}
      S.error='offline';render();return}
    S.needLogin=false;
    try{await this.loadAll()}catch(e){console.error(e);S.error='offline';render();return}
    S.ready=true;render();this.subscribe();
  },
  async login(email,pw){await pb.collection('users').authWithPassword(email,pw);S.error=null;this.fresh=true;await this.init();this.fresh=false},
  logout(){pb.realtime.unsubscribe();pb.authStore.clear();location.reload()},
  async loadAll(){
    const [ls,pr,me,rc,tt]=await Promise.all(['lessons','progress','meta','recordings','tts'].map(c=>pb.collection(c).getFullList({batch:500})));
    S.lessons={};ls.forEach(r=>this.putLesson(r));
    S.progress={};pr.forEach(r=>{this.ids.progress[r.key]=r.id;S.progress[r.key]={w:r.w||{}}});
    S.meta={};me.forEach(r=>{this.ids.meta[r.key]=r.id;S.meta[r.key]=r.data||{}});
    S.recs={};rc.forEach(r=>S.recs[r.id]=r);
    S.tts={};tt.forEach(r=>S.tts[r.voice+'|'+r.text]=r);
  },
  putLesson(r){this.ids.lessons[r.key]=r.id;S.lessons[r.key]={id:r.key,name:r.name,date:r.date,dated:r.dated,order:r.order,words:Array.isArray(r.words)?r.words:[]}},
  subscribe(){
    const soft=()=>softRender();
    pb.collection('lessons').subscribe('*',e=>{if(e.action==='delete'){delete S.lessons[e.record.key];delete this.ids.lessons[e.record.key]}else if(!this.qs['lessons/'+e.record.key+'#busy'])this.putLesson(e.record);soft()});
    pb.collection('progress').subscribe('*',e=>{const k=e.record.key;if(e.action==='delete'){delete S.progress[k];return soft()}this.ids.progress[k]=e.record.id;if(!S.dirty.has(k))S.progress[k]={w:e.record.w||{}};soft()});
    pb.collection('meta').subscribe('*',e=>{this.ids.meta[e.record.key]=e.record.id;S.meta[e.record.key]=e.record.data||{};soft()});
    pb.collection('recordings').subscribe('*',e=>{if(e.action==='delete')delete S.recs[e.record.id];else S.recs[e.record.id]=e.record;soft()});
    pb.collection('tts').subscribe('*',e=>{const r=e.record;if(e.action==='delete')delete S.tts[r.voice+'|'+r.text];else S.tts[r.voice+'|'+r.text]=r;soft()});
  },
  q(path,fn){
    const p=(this.qs[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);
      if(e&&e.status===401){toast('Bitte neu anmelden','err');pb.authStore.clear();S.needLogin=true;render();return}
      toast('Konnte nicht speichern ('+((e&&e.status)||e)+')','err')});
    this.qs[path]=p;return p;
  },
  async retry(fn){for(let i=0;;i++){try{return await fn()}catch(e){if(e&&e.status===429&&i<6){await new Promise(r=>setTimeout(r,800*(i+1)));continue}throw e}}},
  async upsert(col,key,data){
    const id=this.ids[col][key];const R=f=>this.retry(f);
    if(id){try{return await R(()=>pb.collection(col).update(id,data))}catch(e){if(e.status!==404)throw e}}
    try{const r=await R(()=>pb.collection(col).create(Object.assign({key},data)));this.ids[col][key]=r.id;return r}
    catch(e){ // existiert schon (z.B. von anderem Gerät angelegt)
      if(e&&e.status===429)throw e;
      const r=await R(()=>pb.collection(col).getFirstListItem(pb.filter('key={:k}',{k:key})));this.ids[col][key]=r.id;return await R(()=>pb.collection(col).update(r.id,data))}
  },
  saveLesson(l){
    S.lessons[l.id]=l;const d={name:l.name,date:l.date||'',dated:l.dated!==false,order:l.order||0,words:clone(l.words||[])};
    const busy='lessons/'+l.id+'#busy';this.qs[busy]=true;
    return this.q('lessons/'+l.id,()=>this.upsert('lessons',l.id,d)).finally(()=>{delete this.qs[busy]});
  },
  deleteLesson(id){
    const lid=this.ids.lessons[id],pid=this.ids.progress[id];delete S.lessons[id];delete S.progress[id];
    for(const r of recsFor(id))this.deleteRecording(r.id);
    if(pid)this.q('progress/'+id,()=>pb.collection('progress').delete(pid));
    if(lid)return this.q('lessons/'+id,()=>pb.collection('lessons').delete(lid));
  },
  saveProgress(lid,now){
    S.dirty.add(lid);clearTimeout(this.timers[lid]);
    const go=()=>this.q('progress/'+lid,()=>this.upsert('progress',lid,{w:clone((S.progress[lid]||{}).w||{})})).then(()=>S.dirty.delete(lid));
    if(now)return go();
    this.timers[lid]=setTimeout(go,1500);
  },
  flushProgress(){for(const lid of [...S.dirty]){clearTimeout(this.timers[lid]);this.saveProgress(lid,true)}},
  saveMeta(key,obj){S.meta[key]=obj;return this.q('meta/'+key,()=>this.upsert('meta',key,{data:clone(obj)}))},
  async uploadRecording(lessonKey,file){
    const fd=new FormData();fd.append('lesson_key',lessonKey);fd.append('file',file);fd.append('orig_name',file.name);fd.append('status','pending');
    const r=await pb.collection('recordings').create(fd);S.recs[r.id]=r;return r;
  },
  async reprocess(id){const r=await pb.collection('recordings').update(id,{status:'pending',error:''});S.recs[id]=r},
  deleteRecording(id){delete S.recs[id];return this.q('rec/'+id,()=>pb.collection('recordings').delete(id))},
  async token(){if(!this.fileToken||Date.now()-this.fileTokenAt>60e3){this.fileToken=await pb.files.getToken();this.fileTokenAt=Date.now()}return this.fileToken},
  async fileUrl(rec,field){return pb.files.getURL(rec,rec[field],{token:await this.token()})}
};
function recsFor(lessonKey){return Object.values(S.recs||{}).filter(r=>r.lesson_key===lessonKey).sort((a,b)=>(a.created||'').localeCompare(b.created||''))}

/* ---------- audio ---------- */
let ctx=null,curSrc=null;const bufCache={};
function setSession(t){try{if(navigator.audioSession&&navigator.audioSession.type!==t)navigator.audioSession.type=t}catch(e){}}
function actx(){
  if(ctx&&(ctx.state==='closed'))ctx=null;
  if(!ctx){
    setSession('playback');
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ctx=new A();
    try{const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0)}catch(e){}
  }
  if(ctx.state!=='running'){try{ctx.resume()}catch(e){}}
  return ctx;
}
function getBuf(rec,field){
  const k=rec.id+'/'+rec[field];
  if(!bufCache[k])bufCache[k]=(async()=>{const u=await Store.fileUrl(rec,field);const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const ab=await r.arrayBuffer();
    return await new Promise((res,rej)=>actx().decodeAudioData(ab,res,rej))})().catch(e=>{delete bufCache[k];throw e});
  return bufCache[k];
}
function stopAudio(){try{curSrc&&curSrc.stop()}catch(e){}curSrc=null;try{elAudio&&elAudio.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
// resume() kann auf iOS ohne Tippen ewig hängen – deshalb mit Zeitgrenze
const tryResume=c=>Promise.race([c.resume().catch(()=>{}),new Promise(r=>setTimeout(r,400))]);
async function playBuf(buf,s,e){
  let c=actx();stopAudio();
  if(c.state!=='running')await tryResume(c);
  if(c.state!=='running'){try{c.close()}catch(x){}ctx=null;c=actx();await tryResume(c)} // iOS: "interrupted" nach Mikrofon -> neu aufbauen
  if(c.state!=='running')throw new Error('Audio blockiert (Status: '+c.state+')');
  const src=c.createBufferSource();src.buffer=buf;
  // Lautstärke angleichen: Lehrer-Clip und KI-Stimme auf denselben Pegel, Begrenzer gegen Übersteuern
  const g=c.createGain();g.gain.value=levelGain(buf,s,e);
  const lim=c.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=4;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.08;

function buildSession(cfg){
  const now=Date.now();let items=allItems(cfg.lids);
  // Notizen nur bei Karten/Gemischt; Lückensatz braucht einen Beispielsatz
  if(!['card','mix'].includes(cfg.mode))items=items.filter(i=>!isNote(i.w));
  if(cfg.mode==='cloze')items=items.filter(i=>clozeParts(i.w.ex));
  if(cfg.topic)items=items.filter(i=>cfg.topic==='none'?!i.w.topic&&!isNote(i.w):i.w.topic===cfg.topic);
  if(cfg.focus==='due'){
    const due=shuffle(items.filter(i=>isDue(i.p,now))).sort((a,b)=>a.p.d-b.p.d);
    const np=newPlan(items);
    items=interleave(np.recent,due).concat(np.older); // zuerst: neue aus den letzten Stunden + Wiederholungen, dann Archiv
  }else if(cfg.focus==='hard'){items=items.filter(i=>isHard(i.p)).sort((a,b)=>(b.p.l/b.p.n)-(a.p.l/a.p.n))}
  else if(cfg.focus==='new'){items=items.filter(i=>status(i.p)==='n')}

    const last=lessonsSorted()[0];const since=now-14*DAY;
    const a=items.filter(i=>last&&i.lid===last.id);const b=shuffle(items.filter(i=>i.p&&i.p.l>0&&i.p.s>=since&&(!last||i.lid!==last.id)));

    if(j===undefined){seen.set(k,ded.length);ded.push(i)}else if(!clipOf(ded[j].w)&&clipOf(i.w))ded[j]=i}

function mcOptions(it,w,field){
  const sameLesson=(S.lessons[it.lid].words||[]).filter(x=>x.id!==w.id&&!isNote(x));
  let pool=shuffle(sameLesson);
  if(pool.length<6)pool=pool.concat(shuffle(allItems(Object.keys(S.lessons)).map(i=>i.w).filter(x=>x.id!==w.id&&!isNote(x))));
  const seen=new Set([normAns(w[field],field)]);const out=[w[field]];
  const mine=new Set(field==='de'?variants(deAll(w),'de'):variants(w.en,'en'));const used=new Set();
  for(const x of pool){const n=normAns(x[field],field);if(!x[field]||seen.has(n))continue;
    const xv=variants(field==='de'?x.de:x.en,field);
    if(xv.some(v=>mine.has(v)))continue; // wäre auch richtig
    if(xv.some(v=>used.has(v)))continue; // zwei Falschantworten mit gleichem Wort (z. B. zweimal „passend“)
    xv.forEach(v=>used.add(v));seen.add(n);out.push(x[field]);if(out.length>=4)break}
  return shuffle(out);
}

/* Clip-Auswahl aus dem Whisper-Transkript */
function sheetClip(lid,wid){
  const l=S.lessons[lid];const w=l.words.find(x=>x.id===wid);
  const recs=recsFor(lid).filter(r=>r.status==='done'&&Array.isArray(r.transcript)&&r.transcript.length);
  if(!recs.length){toast('Noch kein fertiges Transkript für diese Stunde');return}
  let rec=recs.find(r=>w.clip&&w.clip.rec===r.id)||recs[recs.length-1];let a=null,b=null,cs=null,ce=null;
  if(w.clip&&w.clip.rec===rec.id){cs=w.clip.s;ce=w.clip.e;a=rec.transcript.findIndex(t=>t.e>cs+0.05);b=rec.transcript.findLastIndex?rec.transcript.findLastIndex(t=>t.s<ce-0.05):a;if(a<0)a=null;if(b<0)b=null}
  const fmt=x=>x.toFixed(1).replace('.',',')+' s';
  const draw=()=>{
    const T=rec.transcript;
    const root=openSheet(`<div class="row"><div class="grow"><h2>Lehrer-Clip wählen</h2><div class="sub">${esc(w.en)} = ${esc(w.de)}</div></div><button class="btn icon" data-x="close">✕</button></div>
      <p class="small muted">Tippe auf das erste und das letzte Wort des Ausschnitts. Tippe einzeln für nur ein Wort.</p>
      ${recs.length>1?`<select class="t" id="crec">${recs.map(r=>`<option value="${r.id}" ${r.id===rec.id?'selected':''}>${esc(r.orig_name||r.id)}</option>`).join('')}</select>`:''}
      <div class="chips" style="margin:12px 0;max-height:45vh;overflow:auto">${T.map((t,i)=>{const on=a!=null&&i>=a&&i<=(b??a);return `<button class="chip ${on?'on':''}" data-i="${i}" title="${t.s.toFixed(1)} s">${esc(t.w)}</button>`}).join('')}</div>
      ${cs!=null?`<div class="card small" style="padding:10px 12px">
        <div class="row"><span class="grow">Anfang <b>${fmt(cs)}</b></span><button class="btn icon" data-x="s-" aria-label="Anfang früher">−</button><button class="btn icon" data-x="s+" aria-label="Anfang später">+</button></div>
        <div class="row" style="margin-top:6px"><span class="grow">Ende <b>${fmt(ce)}</b></span><button class="btn icon" data-x="e-" aria-label="Ende früher">−</button><button class="btn icon" data-x="e+" aria-label="Ende später">+</button></div>
        <div class="muted" style="margin-top:4px">Jeder Tipp verschiebt um 0,1 s und spielt den Ausschnitt ab.</div></div>`:''}
      <div class="rate"><button class="btn" data-x="play" ${cs==null?'disabled':''}>▶ Hören</button><button class="btn" data-x="none">Ohne Clip</button><button class="btn pri" data-x="save" ${cs==null?'disabled':''}>Speichern</button></div>`);
    const box=$('.sheet .chips'),on=$('.sheet .chip.on');if(box&&on)box.scrollTop=Math.max(0,on.offsetTop-box.offsetTop-box.clientHeight/2);
    const sel=$('#crec');if(sel)sel.onchange=()=>{rec=recs.find(r=>r.id===sel.value);a=b=cs=ce=null;draw()};
    root.onclick=e=>{
      const ch=e.target.closest('[data-i]');
      if(ch){const i=+ch.dataset.i;if(a==null||b!=null){a=i;b=null}else if(i<a){b=a;a=i}else b=i;[cs,ce]=range(rec,a,b??a);draw();actx();preview(rec,cs,ce);return}
      const x=e.target.closest('[data-x]');if(!x)return;
      if(x.dataset.x==='close')return closeSheet();
      if(x.dataset.x==='play'){actx();preview(rec,cs,ce);return}
      const adj={'s-':[-.1,0],'s+':[.1,0],'e-':[0,-.1],'e+':[0,.1]}[x.dataset.x];
      if(adj){cs=Math.max(0,+(cs+adj[0]).toFixed(2));ce=Math.max(cs+.2,+(ce+adj[1]).toFixed(2));draw();actx();preview(rec,cs,ce);return}
      if(x.dataset.x==='none'){w.noClip=true;Store.saveLesson(l);toast('Lehrer-Clip ausgeschaltet');return closeSheet()}
      if(x.dataset.x==='save'){w.clip={rec:rec.id,s:cs,e:ce,manual:true};delete w.noClip;Store.saveLesson(l);toast('Clip gespeichert');closeSheet()}
    };
  };
  draw();
}
// gleiche Puffer-Logik wie clip_bounds() im Worker
function range(rec,a,b){const T=rec.transcript;const s=T[a].s,e=T[b].e;const pe=a>0?T[a-1].e:0,ns=b+1<T.length?T[b+1].s:e+2;
  return [+Math.max(0,Math.max(s-.3,Math.min(s-.1,pe))).toFixed(2),+Math.min(e+.45,Math.max(e+.2,ns+.05)).toFixed(2)]}
function preview(rec,s,e){getBuf(rec,'file').then(buf=>playBuf(buf,s,e)).catch(e=>toast('Audio-Fehler: '+(e.message||e),'err'))}

let recState=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function startRec(){
  const st=S.ses&&S.ses.state;if(!st)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Dein Browser kann hier nicht aufnehmen','err');return}
  try{
    setSession('play-and-record');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/aac'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);const chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());afterMic();onRecorded(new Blob(chunks,{type:mr.mimeType||mt||'audio/webm'}),st)};
    stopAudio();mr.start();recState={mr,timer:setTimeout(stopRec,7000)};st.rec='on';render();
  }catch(e){afterMic();toast('Mikrofon nicht verfügbar: '+(e.message||e.name),'err')}
}
function afterMic(){ // iOS leitet nach dem Mikrofon den Ton oft auf den Hörer -> Wiedergabe neu aufbauen
  setSession('playback');if(ctx){try{ctx.close()}catch(e){}ctx=null}
}
function stopRec(){if(recState){clearTimeout(recState.timer);try{recState.mr.stop()}catch(e){}recState=null}}
async function onRecorded(blob,st){
  const s=S.ses;if(!s||s.state!==st)return;const it=s.q[s.idx],w=curWord(it);
  if(st.blobUrl)URL.revokeObjectURL(st.blobUrl);st.blobUrl=URL.createObjectURL(blob);st.rec='wait';st.slow=false;render();
  try{
    if(blob.size<1500)throw new Error('Aufnahme zu kurz');
    const fd=new FormData();fd.append('file',blob,'speak.'+(/mp4|aac/.test(blob.type)?'m4a':'webm'));fd.append('expected',ttsText(w.en));fd.append('status','pending');
    const r=await pb.collection('attempts').create(fd);const t0=Date.now();let res=null;
    while(Date.now()-t0<120000){await sleep(700);if(st.cancel)break;res=await pb.collection('attempts').getOne(r.id);if(res.status!=='pending')break;
      if(Date.now()-t0>8000&&!st.slow&&S.ses===s&&s.state===st){st.slow=true;render()}}
    pb.collection('attempts').delete(r.id).catch(()=>{});
    if(st.cancel){st.cancel=false;return}
    if(S.ses!==s||s.state!==st)return;
    if(!res||res.status==='pending')throw new Error('keine Antwort – läuft der Worker?');
    if(res.status==='error')throw new Error(res.error||'Fehler im Worker');
    if(!String(res.heard||'').trim()){st.rec='idle';render();toast('Nichts verstanden – sprich etwas länger und tippe erst danach auf Stopp');return}
    st.heard=res.heard;st.score=speechScore(res.heard,w.en);st.rec='done';
    const ok=st.score>=.8;if(!st.done){st.done=true;st.ok=ok;answer(ok)}else if(ok)st.ok=true;
    render();
  }catch(e){if(S.ses===s&&s.state===st){st.rec='idle';render()}toast('Auswertung fehlgeschlagen: '+(e.message||e),'err')}
}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function numNorm(t){return t.replace(/\b[a-z]+\b/g,x=>{const i=NUMW.indexOf(x);return i>=0?String(i):x}).replace(/\bpercent\b/g,'%').replace(/(\d) %/g,'$1%')}
function speechScore(heard,en){
  const h=numNorm(normAns(heard,'en'));if(!h)return 0;let best=0;
  for(const v0 of variants(en,'en')){const v=numNorm(v0.replace(/(\d) %/g,'$1%'));
    if((' '+h+' ').includes(' '+v+' '))return 1;
    const hw=h.split(' '),n=v.split(' ').length;
    for(let i=0;i+n<=hw.length;i++){const seg=hw.slice(i,i+n).join(' ');best=Math.max(best,1-lev(v,seg)/Math.max(v.length,seg.length))}
    best=Math.max(best,1-lev(v,h)/Math.max(v.length,h.length));
  }
  return best;
}
function viewSpeak(it,w,lbl,spk){

  return `<div class="qcard">${lbl}<div class="q">${esc(w.de)}</div>
      ${st.done?`<div class="a">${esc(w.en)}</div><div style="margin-top:8px">${spk}</div>`:''}</div>

/* ---------- Tägliche Erinnerung (Web-Push) ---------- */
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const P={state:'?',rec:null};
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
async function swReg(){if(!('serviceWorker' in navigator))return null;try{return await navigator.serviceWorker.register('sw.js')}catch(e){console.warn('SW',e);return null}}
async function refreshPush(){
  let st;
  if(!pushSupported())st=isIOS&&!isStandalone()?'homescreen':'unsupported';
  else if(Notification.permission==='denied')st='denied';
  else{const reg=await swReg();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){try{P.rec=await pb.collection('push').getFirstListItem(pb.filter('endpoint={:e}',{e:sub.endpoint}))}catch(e){P.rec=null}st=P.rec?'on':'off'}else{P.rec=null;st='off'}}
  if(st!==P.state){P.state=st;if(S.tab==='more'&&!S.view)softRender()}
}
const TIMES=[];for(let h=6;h<=22;h++)for(const m of ['00','30'])TIMES.push(String(h).padStart(2,'0')+':'+m);
function viewReminder(){
  if(P.state==='?')setTimeout(refreshPush,0);
  const r=P.rec,times=(r&&r.times)||['12:30'];const t1=times[0]||'12:30',t2=times[1]||'';
  const sel=(id,v,none)=>`<select class="t" id="${id}" data-act="pushtime" style="min-height:44px;font-size:16px">${none?'<option value="">keine</option>':''}${TIMES.map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('')}</select>`;
  const body={
    '?':'<p class="small muted">Prüfe …</p>',
    homescreen:'<p class="small muted">Erinnerungen gehen auf dem iPhone nur, wenn die App vom <b>Home-Bildschirm</b> aus geöffnet ist: in Safari <b>Teilen → Zum Home-Bildschirm</b>, dann die App dort öffnen und hier einschalten.</p>',
    unsupported:'<p class="small muted">Dieser Browser unterstützt keine Mitteilungen.</p>',
    denied:'<p class="small muted">Mitteilungen sind für die App blockiert. Auf dem iPhone unter <b>Einstellungen → Mitteilungen → Vokabeln</b> erlauben.</p>',
    off:`<p class="small muted">Eine Mitteilung pro Tag – nur, wenn du an dem Tag noch nicht geübt hast. Mit Anzahl der Wörter, Serie und Wort des Tages.</p><button class="btn pri full" data-act="pushon">🔔 Erinnerung einschalten</button>`,
    on:`<div class="row" style="gap:10px"><div class="grow"><label class="f" style="margin-top:0">Uhrzeit</label>${sel('pt1',t1)}</div><div class="grow"><label class="f" style="margin-top:0">2. Erinnerung</label>${sel('pt2',t2,true)}</div></div>
      <p class="small muted" style="margin:8px 0">Kommt nur, wenn du an dem Tag noch nicht geübt hast. Gilt für dieses Gerät.</p>
      <div class="row" style="gap:10px"><button class="btn grow" data-act="pushtest">Test senden</button><button class="btn grow" data-act="pushoff">Ausschalten</button></div>`
  }[P.state];
  return `<div class="card"><h3>🔔 Tägliche Erinnerung${P.state==='on'?' <span class="tag">an</span>':''}</h3>${body}</div>`;
}
function b64ToBytes(b){b=b.replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
async function pushOn(){
  const key=S.meta.push&&S.meta.push.publicKey;if(!key)return toast('Der Server hat noch keinen Push-Schlüssel – läuft der Worker?','err');
  let perm;try{perm=await Notification.requestPermission()}catch(e){perm='denied'}
  if(perm!=='granted'){P.state=perm==='denied'?'denied':'off';render();return toast('Mitteilungen nicht erlaubt')}
  try{
    const reg=await swReg();await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(key)});
    const j=sub.toJSON();const data={endpoint:j.endpoint,sub:j,times:['12:30'],tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Berlin',last:{},test:false,device:(isIOS?'iPhone/iPad':navigator.platform||'').slice(0,200)};
    try{const ex=await pb.collection('push').getFirstListItem(pb.filter('endpoint={:e}',{e:j.endpoint}));P.rec=await pb.collection('push').update(ex.id,{sub:j,tz:data.tz})}
    catch(e){P.rec=await pb.collection('push').create(data)}
    P.state='on';render();toast('Erinnerung eingeschaltet – täglich um '+P.rec.times[0]);
  }catch(e){console.error(e);toast('Einschalten fehlgeschlagen: '+(e.message||e),'err')}
}
async function pushOff(){
  try{const reg=await swReg();const sub=reg&&await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
  if(P.rec)try{await pb.collection('push').delete(P.rec.id)}catch(e){}
  P.rec=null;P.state='off';render();toast('Erinnerung ausgeschaltet');
}
async function pushTimes(){
  if(!P.rec)return;const t=[$('#pt1').value,$('#pt2').value].filter(Boolean);
  try{P.rec=await pb.collection('push').update(P.rec.id,{times:[...new Set(t)]});toast('Gespeichert: '+P.rec.times.join(' und '))}catch(e){toast('Konnte nicht speichern','err')}
}
async function pushTest(){
  if(!P.rec)return;try{P.rec=await pb.collection('push').update(P.rec.id,{test:true});toast('Test kommt in spätestens einer Minute')}catch(e){toast('Konnte nicht senden','err')}
}

function newWidgetKey(){const a=new Uint8Array(24);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function widgetKey(){
  if(S.meta.widget&&S.meta.widget.key&&!(await confirmBox('Neuen Schlüssel erzeugen? Bereits eingerichtete Widgets zeigen dann „Schlüssel ungültig“, bis du das Skript neu kopierst.','Neu erzeugen')))return;
  await Store.saveMeta('widget',{key:newWidgetKey(),at:Date.now(),open:widgetOpen()});widgetSrc=null;render();toast('Schlüssel erzeugt');
}
const localAddr=()=>location.protocol!=='https:'||/^(\d+\.){3}\d+$|^localhost$|\.local$/.test(location.hostname);
const widgetOpen=()=>{const o=S.meta.widget&&S.meta.widget.open;return o==='browser'?'browser':'shortcut'}; // webapp:// direkt kann Scriptable nicht öffnen
function widgetScript(){

async function widgetCopy(){

/* ---------- Kenn ich schon? – schnell vorsortieren ---------- */
const SORT_PAGE=20;
const knownProg=()=>{const now=Date.now();return {b:5,n:1,l:0,s:now,d:startOfDay(now)+INT[5]*DAY,k:1}}; // kommt in 30 Tagen zur Kontrolle
// alle Stunden: noch nie geübte Wörter (neueste Stunden zuerst) · eine Stunde: alle noch nicht sicheren
function sortItems(lid){
  if(!lid)return newByPriority(allItems(lessonsSorted().map(l=>l.id))).filter(i=>!(i.p&&i.p.q));
  const seen=new Set();return allItems([lid]).filter(i=>!isNote(i.w)&&status(i.p)!=='s').filter(i=>{const k=wkey(i.w);if(seen.has(k))return false;seen.add(k);return true});
}
function startSort(opt={}){
  const q=sortItems(opt.lid);
  if(!q.length)return toast(opt.lid?'In dieser Stunde ist schon alles sicher':'Keine ungeübten Wörter zum Vorsortieren');
  freshAudio();
  S.sort={q,idx:0,hist:[],known:0,show:false,mode:opt.lid?'list':(set().sortMode||'list'),lid:opt.lid||null,sel:new Set(),pageSize:opt.lid?q.length:SORT_PAGE,selK:new Set(),open:new Set(),qry:''};
  if(opt.lid)q.forEach((_,i)=>S.sort.sel.add(i)); // ganze Stunde: alles vormarkiert, nur Unbekanntes abwählen
  render();
}
function sortMark(know){
  const s=S.sort;const it=s.q[s.idx];if(!it)return;const cur=prog(it.lid,it.w.id)||{b:0,n:0,l:0};
  const p=know?knownProg():Object.assign({},cur,{q:1});
  s.hist.push({touched:setProg(it.lid,it.w.id,p),known:know?1:0,count:1});if(know)s.known++;s.idx++;s.show=false;render();
}
function sortApply(){
  const s=S.sort;const end=Math.min(s.q.length,s.idx+s.pageSize);const touched=[];let k=0;const sel=[];
  for(let i=s.idx;i<end;i++){const it=s.q[i];const cur=prog(it.lid,it.w.id)||{b:0,n:0,l:0};
    if(s.sel.has(i)){touched.push(...setProg(it.lid,it.w.id,knownProg()));k++;sel.push(i)}
    else if(!s.lid)touched.push(...setProg(it.lid,it.w.id,Object.assign({},cur,{q:1})));}
  s.hist.push({touched,known:k,count:end-s.idx,sel});s.known+=k;s.idx=end;s.sel=new Set();render();
  const el=$('.ses');if(el)el.scrollTop=0;
}
function sortUndo(){
  const s=S.sort;const h=s.hist.pop();if(!h)return;
  for(const [lid,wid,old] of h.touched.slice().reverse()){if(old)S.progress[lid].w[wid]=old;else delete S.progress[lid].w[wid];Store.saveProgress(lid)}
  s.known-=h.known;
  if(h.selK){s.q=sortItems();s.idx=0;s.selK=new Set(h.selK);render();return}
  s.idx-=h.count;s.sel=new Set(h.sel||[]);s.show=false;render();
}
/* Übersicht aller Stunden (aufklappbar) – nur markierte Wörter werden übernommen */
const sKey=it=>it.lid+'|'+it.w.id;
function sortGroups(s){
  const by=new Map();const q=normAns(s.qry||'','de');
  for(const it of s.q){if(q&&!(normAns(it.w.en,'en').includes(q)||normAns(it.w.de,'de').includes(q)||it.w.en.toLowerCase().includes(q)))continue;
    if(!by.has(it.lid))by.set(it.lid,[]);by.get(it.lid).push(it)}
  return lessonsSorted().filter(l=>by.has(l.id)).map(l=>({l,items:by.get(l.id)}));
}
function sortAccHtml(s){
  const gs=sortGroups(s);if(!gs.length)return `<p class="muted center" style="padding:20px 0">${s.qry?'Nichts gefunden':'Keine Wörter mehr zum Sortieren'}</p>`;
  return gs.map(({l,items})=>{const open=s.qry||s.open.has(l.id);const k=items.filter(it=>s.selK.has(sKey(it))).length;const all=k===items.length;

      <div class="li" style="padding:0;min-height:52px;gap:0"><button class="grow" data-act="sortopen" data-v="${l.id}" style="all:unset;flex:1;min-width:0;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px">
        <span style="width:14px;flex:none;color:var(--muted)">${open?'▾':'▸'}</span><span style="min-width:0"><div class="en">${esc(l.name)}</div><div class="de">${items.length} ${items.length===1?'Wort':'Wörter'}${k?` · <b style="color:var(--ok)">${k} ✓</b>`:''}</div></span></button>

      ${open?items.map(it=>{const on=s.selK.has(sKey(it));return `<button class="li" data-act="sortk" data-v="${sKey(it)}" style="min-height:50px;${on?'background:var(--ok-soft)':''}"><span style="font-size:20px;width:24px;flex:none">${on?'✅':'⬜️'}</span><span class="grow" style="min-width:0"><div class="en">${esc(it.w.en)}</div><div class="de">${esc(it.w.de)}</div></span></button>`}).join(''):''}
    </div>`}).join('');
}
function sortFootHtml(s){const n=s.selK.size;
  return `<button class="btn pri full" style="min-height:56px" data-act="sortapplyk" ${n?'':'disabled'}>${n?`Übernehmen · ${n} gekannt`:'Tippe an, was du schon kannst'}</button>
    <div class="row" style="margin-top:6px"><button class="btn ghost" data-act="sortundo" ${s.hist.length?'':'disabled'}>↶ Zurück</button><div class="grow"></div><button class="btn ghost" data-act="sortend">Fertig</button></div>`}
function sortAccUpdate(){const s=S.sort;const a=$('#sortacc'),f=$('#sortfoot');if(!a||!f)return render();a.innerHTML=sortAccHtml(s);f.innerHTML=sortFootHtml(s)}
function viewSortAcc(s){

function sortApplyK(){
  const s=S.sort;const touched=[];let k=0;
  for(const it of s.q)if(s.selK.has(sKey(it))){touched.push(...setProg(it.lid,it.w.id,knownProg()));k++}
  if(!k)return;s.hist.push({touched,known:k,selK:[...s.selK]});s.known+=k;s.selK=new Set();s.q=sortItems();s.idx=0;
  Store.flushProgress();toast(`${k} Wörter als gekannt markiert`);const el=$('.ses'),y=el?el.scrollTop:0;render();const e2=$('.ses');if(e2)e2.scrollTop=y;

function sortDone(s){
  Store.flushProgress();const done=s.idx;
  return `<div class="ses"><div class="spacer"></div><div class="qcard"><div class="lbl">Fertig</div><div class="q">${done} Wörter sortiert</div>
    <div class="x">${s.known} kanntest du schon – die kommen erst in 30 Tagen zur Kontrolle wieder.${s.lid?'':` ${done-s.known} lernst du nach und nach über das Tageslimit.`}</div></div>

function sortHead(s){

  return `<div class="row" style="padding:14px 0 4px"><button class="btn icon ghost" data-act="sortend" aria-label="Beenden">✕</button>${acc?`<div class="grow"><b>Kenn ich schon?</b></div><span class="small muted">${s.q.length} unsortiert</span>`:`<div class="prog"><i style="width:${s.idx/s.q.length*100}%"></i></div><span class="small muted">${s.idx}/${s.q.length}</span>`}</div>
    <div class="row" style="margin:4px 0 8px"><div class="small muted grow">${s.known} gekannt${l?' · '+esc(l.name):''}</div>
    ${s.lid?'':`<div class="seg" style="width:170px">${[['list','☰ Liste'],['card','🃏 Karten']].map(([v,t])=>`<button data-act="sortmode" data-v="${v}" class="${s.mode===v?'on':''}" style="min-height:34px;padding:4px">${t}</button>`).join('')}</div>`}</div>`;
}
function viewSort(){
  const s=S.sort;if(s.idx>=s.q.length)return sortDone(s);
  if(s.mode==='list'&&!s.lid)return viewSortAcc(s);
  return s.mode==='list'?viewSortList(s):viewSortCard(s);

function viewSortList(s){

    <div class="row" style="gap:8px;margin-bottom:8px"><button class="btn grow" style="min-height:42px" data-act="sortall">✅ Alle</button><button class="btn grow" style="min-height:42px" data-act="sortnone">⬜️ Keine</button></div>

function parseBulk(text,first){
  const out=[];
  for(let raw of String(text||'').split(/\r?\n/)){
    const line=raw.replace(/ /g,' ').trim();if(!line)continue;
    let parts;
    if(line.includes('\t'))parts=line.split('\t').map(x=>x.trim()).filter(Boolean);
    else{const m=line.match(/\s*(?:=|;|\t| – | — | - | -> | → )\s*/);parts=m?[line.slice(0,m.index),line.slice(m.index+m[0].length)].map(x=>x.trim()):[line]}
    parts=parts.map(p=>p.replace(/^(?:[-•*]|\d+[.)])\s+/,'').trim()); // Aufzählungszeichen wie "1." oder "-" weg
    let [a,b,c]=parts;
    if(/^(deutsch|german|englisch|english)$/i.test(a||''))continue; // Kopfzeile
    if(!a||!b){out.push({bad:true,raw:line});continue}

  }
  return out;
}

async function loadXLSX(){

const cellText=v=>v==null?'':String(v).replace(/ /g,' ').replace(/\s+/g,' ').trim().replace(/,$/,'').trim();
// gültiges Datum bauen; vertauschte Tag/Monat-Angaben (z. B. "2024.29.04") werden erkannt
function isoDate(y,mo,d){mo=+mo;d=+d;if(mo>12&&d<=12)[mo,d]=[d,mo];
  const t=new Date(Date.UTC(+y,mo-1,d));if(mo<1||mo>12||t.getUTCDate()!==d)return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
// Reparatur älterer Importe: vertauschte Daten korrigieren, Stunden ohne Datum eindeutig benennen
async function repairLessons(){
  const fix=[];
  for(const l of Object.values(S.lessons)){
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(l.date||'');if(!m)continue;
    const iso=isoDate(m[1],m[2],m[3]);
    if(iso&&iso!==l.date){if(l.dated!==false&&l.name===fmtDate(l.date))l.name=fmtDate(iso);l.date=iso;fix.push(l)}
  }
  const groups={};
  for(const l of Object.values(S.lessons))if(l.dated===false&&/^Stunde ohne Datum \(nach (\d{2}\.\d{2}\.|\?)\)$/.test(l.name))(groups[l.date]=groups[l.date]||[]).push(l);
  for(const d in groups){
    const all=Object.values(S.lessons).filter(l=>l.dated===false&&l.date===d).sort((a,b)=>(a.order||0)-(b.order||0));
    all.forEach((l,i)=>{const n=`Stunde ohne Datum (nach ${fmtDate(d)})${i?` (${i+1})`:''}`;if(groups[d].includes(l)&&l.name!==n){l.name=n;if(!fix.includes(l))fix.push(l)}});
  }
  for(const l of fix)await Store.saveLesson(l);
  return fix.length;
}
function sheetDate(name){
  let m=/(\d{4})\.+(\d{1,2})\.(\d{1,2})/.exec(name);if(m)return isoDate(m[1],m[2],m[3]);
  m=/(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(name);if(m)return isoDate(m[3],m[2],m[1]);
  return null;
}
// Optionale Korrekturliste für eine bekannte Kurs-Excel: pb_public/known_fix.json (nicht im Repo).
// Format: [[Excel-Deutsch, Excel-Englisch, neu Deutsch, neu Englisch], …]
let KNOWN_FIX_MAP=new Map();
async function loadKnownFix(){
  try{const r=await fetch('known_fix.json',{cache:'no-store'});if(!r.ok)return;const a=await r.json();
    if(Array.isArray(a))KNOWN_FIX_MAP=new Map(a.filter(x=>Array.isArray(x)&&x.length===4).map(x=>[x[0]+'\u0001'+x[1],x]))}catch(e){}
}
// bekannt = gleich, oder bei längeren Einträgen fast gleich (z. B. korrigierter Tippfehler "bee" -> "be")
function isKnown(known,k){
  if(known.has(k))return true;
  if(k.length<=12)return false;
  for(const x of known){const m=Math.max(x.length,k.length);if(x.length>12&&Math.abs(x.length-k.length)<=3&&1-lev(x,k)/m>=0.9)return true}
  return false;
}
function excelRows(rows){
  const out=[];
  for(const r of rows){
    let de=cellText(r[0]),en=cellText(r[1]);const c=cellText(r[2]);let ex=null;
    if(!en&&c){en=c;de=de.replace(/^\d+\.\s*/,'')}else if(c&&c.includes('['))ex=c; // Satz in Spalte C: Nummerierung "1." weg
    if(!de&&!en)continue;
    if(['0','#NAME?','#N/A','#WERT!','#VALUE!'].includes(en)||/^(deutsch|german)$/i.test(de)||/^SATZBAU/i.test(de)&&!en)continue;
    out.push({de,en,ex});
  }
  return out;
}
function lessonKeys(l){const k=new Set();for(const w of (l&&l.words)||[]){k.add(wkey(w));if(w.orig&&w.orig.en)k.add(normAns(w.orig.en,'en'))}return k}
function rowKeys(r){const k=[normAns(r.en,'en')];const kf=KNOWN_FIX_MAP.get(r.de+'\u0001'+r.en);if(kf)k.push(normAns(kf[3],'en'));return k.filter(Boolean)}
// wie viele Zeilen eines Reiters stecken schon in einer Stunde?
function overlap(rows,l){const k=lessonKeys(l);let n=0;for(const r of rows)if(rowKeys(r).some(x=>isKnown(k,x)))n++;return n}
// Zeilen eines Reiters gegen die gewählte Stunde prüfen: neu / schon da / unvollständig
function xBuild(p,si){
  const known=lessonKeys(p.existing);const items=[];let ri=0;
  for(const r of p.rows){
    const id='x'+si+'_'+(ri++);const {de,en,ex}=r;
    if(en&&isKnown(known,normAns(en,'en'))){items.push({id,de,en,st:'dup'});continue}
    const it={id,de,en,st:'new',on:true};if(ex)it.ex=ex;
    const kf=KNOWN_FIX_MAP.get(de+'\u0001'+en);
    if(kf){it.de=kf[2];it.en=kf[3];it.orig={de,en};it.fix='auto';
      if(isKnown(known,normAns(it.en,'en'))){it.st='dup';items.push(it);continue}}
    if(!it.de||!it.en)it.st='bad';

function excelPlan(wb){
  const plan=[];let prev=null;const claimed=new Set(),newCount={};
  wb.SheetNames.forEach((name,si)=>{
    const rows=excelRows(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,blankrows:false,defval:null}));
    const date=sheetDate(name);const p={sheet:name,si,date,rows,open:false,existing:null};
    if(date){p.title=fmtDate(date);p.existing=lessonsSorted().find(l=>l.date===date&&l.dated!==false)||null}
    else if(rows.length){
      // Reiter ohne Datum: passende Stunde ohne Datum nach demselben Datum über den Inhalt finden
      const cands=Object.values(S.lessons).filter(l=>l.dated===false&&!claimed.has(l.id)&&(prev?l.date===prev:true))
        .map(l=>({l,n:overlap(rows,l)})).filter(c=>c.n>0).sort((a,b)=>b.n-a.n||(a.l.order||0)-(b.l.order||0));
      const best=cands[0];
      if(best&&best.n>=Math.max(1,Math.ceil(rows.length*0.5))&&!(cands[1]&&cands[1].n===best.n))p.existing=best.l;
      else if(best){p.ask=true;p.choices=cands.slice(0,5);p.existing=null} // unsicher: Nutzer entscheidet
      if(prev){const have=Object.values(S.lessons).filter(l=>l.dated===false&&l.date===prev).length;newCount[prev]=(newCount[prev]||have)+(p.existing?0:1);
        p.title=p.existing?p.existing.name:`Stunde ohne Datum (nach ${fmtDate(prev)})${newCount[prev]>1?` (${newCount[prev]})`:''}`}
      else p.title=p.existing?p.existing.name:'Stunde ohne Datum';
      p.newTitle=p.title;
    }else p.title=name;
    if(p.existing)claimed.add(p.existing.id);

    if(date)prev=date;

function closeSheet(){$('#sheets').innerHTML='';render()}
function confirmBox(text,ok){return new Promise(res=>{const root=openSheet(`<h3>${esc(text)}</h3><div class="row" style="margin-top:18px"><button class="btn grow" data-r="0">Abbrechen</button><button class="btn bad grow" data-r="1">${esc(ok)}</button></div>`);
  root.onclick=e=>{const b=e.target.closest('[data-r]');if(b||e.target.classList.contains('scrim')){root.onclick=null;root.innerHTML='';res(!!(b&&b.dataset.r==='1'))}}})}
function sheetWord(lid,wid){
  const l=S.lessons[lid];const w=l.words.find(x=>x.id===wid);
  const note=isNote(w);const dups=dupsOf(lid,w);
  const root=openSheet(`<h2>${note?'Notiz bearbeiten':'Wort bearbeiten'}</h2>
    <label class="f">${note?'Vorderseite':'Deutsch'}</label><input class="t" id="ede" value="${esc(w.de)}">
    <label class="f">${note?'Rückseite':'Englisch'}</label><input class="t" id="een" value="${esc(w.en)}" autocapitalize="off" spellcheck="false">
    ${dups.length?`<div class="hint">Kommt auch vor in: ${dups.map(x=>esc(x.name)).join(', ')} – der Lernstand ist gemeinsam.</div>`:''}
    ${note?'':`<label class="f">Weitere Bedeutungen – mit Komma getrennt, zählen beim Üben auch als richtig</label><input class="t" id="eal" value="${esc(w.alt||'')}" placeholder="z. B. ausmachen, berücksichtigen">`}
    <label class="f">Beispielsatz – Vokabel in [ ] für Lückensätze</label><input class="t" id="eex" value="${esc(w.ex||'')}" autocapitalize="off" placeholder="Learning a language needs a lot of [patience].">
    <label class="f">Notiz</label><input class="t" id="eno" value="${esc(w.note||'')}">
    ${note?'':`<label class="f">Thema</label><select class="t" id="etp"><option value="">– kein Thema –</option>${TOPICS.map(t=>`<option value="${t[0]}" ${w.topic===t[0]?'selected':''}>${t[1]} ${esc(t[2])}</option>`).join('')}</select>`}
    <div class="card small" style="margin-top:12px"><b>Lehrer-Clip:</b> ${clipOf(w)?`${(clipOf(w).e-clipOf(w).s).toFixed(1)} s${w.clip.manual?' (von dir gewählt)':' (automatisch)'}`:w.noClip?'ausgeschaltet':'keiner'}
      <div class="row wrap" style="margin-top:6px">${clipOf(w)?'<button class="btn ghost small" style="min-height:36px;padding:6px 10px" data-x="pclip">▶ Anhören</button>':''}<button class="btn ghost small" style="min-height:36px;padding:6px 10px" data-x="clip">Ausschnitt wählen</button></div></div>
    ${w.orig?`<div class="card small" style="margin-top:12px">Im Excel stand: <b>${esc(w.orig.de||'–')}</b> = <b>${esc(w.orig.en||'–')}</b><br><button class="btn ghost small" style="margin-top:6px;min-height:36px;padding:6px 10px" data-x="restore">Original wiederherstellen</button></div>`:''}
    <div class="row" style="margin-top:18px"><button class="btn bad" data-x="del">Löschen</button><div class="grow"></div><button class="btn" data-x="close">Abbrechen</button><button class="btn pri" data-x="save">Speichern</button></div>`);
  root.onclick=async e=>{
    const x=e.target.closest('[data-x]');if(e.target.classList.contains('scrim'))return closeSheet();if(!x)return;
    if(x.dataset.x==='close')return closeSheet();
    if(x.dataset.x==='restore'){$('#ede').value=w.orig.de;$('#een').value=w.orig.en;return}
    if(x.dataset.x==='pclip'){playWord(lid,wid,'teacher');return}
    if(x.dataset.x==='clip'){$('#sheets').innerHTML='';sheetClip(lid,wid);return}
    if(x.dataset.x==='del'){if(await confirmBox(`„${w.en}“ löschen?`,'Löschen')){l.words=l.words.filter(y=>y.id!==wid);Store.saveLesson(l);toast('Gelöscht')}return closeSheet()}
    if(x.dataset.x==='save'){
      const de=$('#ede').value.trim(),en=$('#een').value.trim();if(!de||!en)return toast('Deutsch und Englisch ausfüllen');
      Object.assign(w,{de,en,ex:$('#eex').value.trim()||undefined,note:$('#eno').value.trim()||undefined});if($('#etp')){w.topic=$('#etp').value||undefined}if($('#eal'))w.alt=$('#eal').value.trim();
      if(w.orig&&w.orig.de===de&&w.orig.en===en)delete w.orig;
      Store.saveLesson(l);toast('Gespeichert');closeSheet();
    }
  };
}
function sheetLesson(id){
  const l=id?S.lessons[id]:null;const d=l?l.date:todayISO();
  const root=openSheet(`<h2>${l?'Stunde bearbeiten':'Neue Stunde'}</h2>
    <label class="f">Datum</label><input class="t" type="date" id="ldate" value="${esc(d||'')}">
    <label class="f">Name</label><input class="t" id="lname" value="${esc(l?l.name:fmtDate(d))}">
    <div class="row" style="margin-top:18px">${l?'<button class="btn bad" data-x="del">Löschen</button>':''}<div class="grow"></div><button class="btn" data-x="close">Abbrechen</button><button class="btn pri" data-x="save">Speichern</button></div>`);
  $('#ldate').addEventListener('change',e=>{const n=$('#lname');if(!l||n.value===fmtDate(l.date))n.value=fmtDate(e.target.value)});
  root.onclick=async e=>{
    const x=e.target.closest('[data-x]');if(e.target.classList.contains('scrim'))return closeSheet();if(!x)return;
    if(x.dataset.x==='close')return closeSheet();
    if(x.dataset.x==='del'){if(await confirmBox(`Stunde „${l.name}“ mit ${l.words.length} Wörtern löschen?`,'Löschen')){Store.deleteLesson(id);S.view=null;toast('Stunde gelöscht')}return closeSheet()}
    if(x.dataset.x==='save'){
      const date=$('#ldate').value||todayISO();const name=$('#lname').value.trim()||fmtDate(date);
      if(l){Object.assign(l,{date,name,dated:true});Store.saveLesson(l)}
      else{const nl=newLesson(date,name);S.view={lesson:nl.id};S.tab='lessons'}
      closeSheet();
    }
  };
}
function newLesson(date,name){
  let id='L'+date.replace(/-/g,'');while(S.lessons[id])id+='b';
  const maxO=Math.max(0,...Object.values(S.lessons).map(l=>l.order||0));
  const l={id,name:name||fmtDate(date),date,dated:true,order:maxO+1,words:[]};Store.saveLesson(l);return l;
}
/* ---------- events ---------- */
function mount(){
  if(S.player){plCur=-1;plTick()}
  const sc=$('#sortcard');if(sc)swipeable(sc,()=>sortMark(false),()=>sortMark(true));
  const wr=$('#wr');if(wr)setTimeout(()=>wr.focus(),50);
  const nb=$('#nextbtn');if(nb)setTimeout(()=>nb.focus(),50);
  const aen=$('#aen');if(aen){const f=()=>dupHint();aen.oninput=f;$('#ade').oninput=f}
  const s=S.ses;
  if(s&&s.idx<s.q.length){const it=s.q[s.idx];const st=s.state||{};
    if((it.type==='listen'||it.type==='dict')&&!st.autoplayed){st.autoplayed=true;setTimeout(()=>playWord(it.lid,it.wid),250)}
    else if(!['listen','dict','speak','cloze'].includes(it.type)&&!isNote(curWord(it))&&it.dir==='en-de'&&!st.autoplayed&&set().autoplay){st.autoplayed=true;setTimeout(()=>playWord(it.lid,it.wid),250)}}
}
function dupHint(){
  const en=normAns($('#aen').value,'en');const box=$('#duphint');if(!box)return;
  if(en.length<3){box.innerHTML='';return}
  for(const l of lessonsSorted())for(const w of l.words||[])if(normAns(w.en,'en')===en){box.innerHTML=`<div class="hint">Gibt es schon in Stunde ${esc(l.name)}: ${esc(w.en)} = ${esc(w.de)}</div>`;return}
  box.innerHTML='';
}
function autoSpeakAfter(it){if(set().autoplay&&it.type!=='listen'&&it.type!=='dict'&&!isNote(curWord(it))&&(it.dir==='de-en'||it.type==='cloze'))return playWord(it.lid,it.wid);return null}

document.addEventListener('click',async e=>{
  const tb=e.target.closest('#tabs button');if(tb){S.tab=tb.dataset.tab;S.view=null;if(tb.dataset.tab==='practice')S.setup=null;render();window.scrollTo(0,0);return}
  const tw=e.target.closest('#pltx .tw');if(tw&&S.player){const rec=S.recs[S.player.q[S.player.idx]];const t=rec&&rec.transcript&&rec.transcript[+tw.dataset.ti];
    if(t){PA.currentTime=Math.max(0,t.s-0.15);plScrollAt=Date.now();if(PA.paused)PA.play().catch(()=>{})}return}
  const b=e.target.closest('[data-act]');if(!b||!app.contains(b))return;
  const a=b.dataset.act,v=b.dataset.v;const s=S.ses;
  switch(a){
    case 'tab':S.tab=v;render();break;
    case 'quick':{const ls=lessonsSorted();const st=set();
      const lids=v==='last'?[ls[0].id]:ls.map(l=>l.id);
      // Schnellstart (Startseite) immer gemischt – die Übungsart unter „Üben“ gilt nur dort
      if(v==='prep'){startSession({lids:ls.map(l=>l.id),focus:'prep',mode:'mix',dir:st.dir,len:0,keep:true});break}
      startSession({lids,focus:v==='hard'?'hard':v==='last'?'all':'due',mode:'mix',dir:st.dir,len:v==='last'?0:20,keep:true});break}
    case 'open':S.tab='lessons';S.view={lesson:v};recsFor(v).filter(r=>r.status==='done').forEach(r=>getBuf(r,'file').catch(()=>{}));render();window.scrollTo(0,0);break;
    case 'back':S.view=null;render();break;
    case 'pick':{const ls=lessonsSorted();S.setup.lids=v==='last'?ls.slice(0,1).map(l=>l.id):v==='last3'?ls.slice(0,3).map(l=>l.id):v==='all'?ls.map(l=>l.id):[];render();break}
    case 'toggle':{const L=S.setup.lids;const i=L.indexOf(v);if(i>=0)L.splice(i,1);else L.push(v);render();break}
    case 'setup':{const k=b.dataset.k;S.setup[k]=k==='len'?+v:v;render();break}
    case 'topic':{const u=S.setup;if(v&&!u.topic)u.lids=lessonsSorted().map(l=>l.id);u.topic=v;render();break}
    case 'sortstart':startSort();break;
    case 'sortknow':sortMark(true);break;
    case 'sortlearn':sortMark(false);break;
    case 'sortundo':sortUndo();break;
    case 'sortshow':if(S.sort){S.sort.show=true;render()}break;
    case 'sortplay':{const it=S.sort&&S.sort.q[S.sort.idx];if(it)playWord(it.lid,it.w.id);break}
    case 'sortend':S.sort=null;Store.flushProgress();render();break;
    case 'sorttoggle':{const i=+v;const sel=S.sort.sel;if(sel.has(i))sel.delete(i);else sel.add(i);const y=$('.ses').scrollTop;render();$('.ses').scrollTop=y;break}
    case 'sortall':{const s=S.sort;for(let i=s.idx;i<Math.min(s.q.length,s.idx+s.pageSize);i++)s.sel.add(i);const y=$('.ses').scrollTop;render();$('.ses').scrollTop=y;break}
    case 'sortnone':{const s=S.sort;for(let i=s.idx;i<s.idx+s.pageSize;i++)s.sel.delete(i);const y=$('.ses').scrollTop;render();$('.ses').scrollTop=y;break}
    case 'sortapply':sortApply();break;
    case 'sortapplyk':sortApplyK();break;
    case 'sortopen':{const o=S.sort.open;if(o.has(v))o.delete(v);else o.add(v);sortAccUpdate();break}
    case 'sortk':{const k=S.sort.selK;if(k.has(v))k.delete(v);else k.add(v);sortAccUpdate();break}
    case 'sortlall':{const s=S.sort;const g=sortGroups(s).find(x=>x.l.id===v);if(!g)break;const keys=g.items.map(sKey);const all=keys.every(k=>s.selK.has(k));keys.forEach(k=>all?s.selK.delete(k):s.selK.add(k));if(!all&&!s.qry)s.open.add(v);sortAccUpdate();break}
    case 'sortmode':{if(S.sort.mode!==v){S.sort.q=sortItems();S.sort.idx=0;S.sort.hist=[];S.sort.selK=new Set()}S.sort.mode=v;S.sort.show=false;const st=set();if(st.sortMode!==v){st.sortMode=v;Store.saveMeta('settings',st)}render();break}
    case 'lessonsort':startSort({lid:S.view.lesson});break;
    case 'probe':startProbe(S.view.lesson);break;
    case 'probeans':probeAnswer(v==='1');break;
    case 'probeshow':S.probe.show=true;render();break;
    case 'probeplay':{const it=S.probe.items[S.probe.idx];if(it)playWord(it.lid,it.w.id);break}
    case 'probeall':probeAll();break;
    case 'probelist':{const lid=S.probe.lid;S.probe=null;startSort({lid});break}
    case 'probeend':S.probe=null;Store.flushProgress();render();break;
    case 'topics':sheetTopics(S.view.lesson);break;
    case 'pushon':pushOn();break;
    case 'pushoff':pushOff();break;
    case 'pushtest':pushTest();break;
    case 'widgetkey':widgetKey();break;
    case 'voicepick':voicePick(v);break;
    case 'voicesample':voiceSample(v);break;
    case 'widgetcopy':widgetCopy();break;
    case 'widgetopen':Store.saveMeta('widget',Object.assign({},S.meta.widget,{open:v}));render();break;
    case 'start':if(S.setup.mode==='hear'){plUnlock();startPlayer(S.setup.lids.slice())}else startSession(Object.assign({},S.setup));break;
    case 'hear':plUnlock();startPlayer([v]);break;
    case 'hearrec':{plUnlock();const r=S.recs[v];if(r)startPlayer([r.lesson_key],v);break}
    case 'plclose':closePlayer();break;
    case 'pltoggle':if(S.player&&!S.player.loading){if(PA.paused||PA.src.startsWith('data:')){if(PA.src.startsWith('data:'))plLoad(true);else PA.play().catch(e=>toast('Abspielen nicht möglich','err'))}else PA.pause()}break;
    case 'plback':PA.currentTime=Math.max(0,PA.currentTime-10);break;
    case 'plfwd':PA.currentTime=Math.min(PA.duration||0,PA.currentTime+10);break;
    case 'plprev':plStep(-1);break;
    case 'plnext':plStep(1);break;
    case 'plrate':{S.player.rate=+v;PA.playbackRate=+v;PA.defaultPlaybackRate=+v;render();break}
    case 'plloop':S.player.loop=!S.player.loop;render();break;
    case 'quit':
      stopRec();if(s&&s.idx<s.q.length&&s.right+s.wrong>0){S.ses.idx=S.ses.q.length;Store.flushProgress();flushStats();render()}else endSession();break;
    case 'redo':{const m=s.mistakes.slice();const cfg=Object.assign({},s.cfg);S.ses={cfg,noSrs:true,q:shuffle(m).map(x=>({lid:x.lid,wid:x.wid,dir:cfg.dir==='en-de'?'en-de':'de-en',type:'mc',clip:false})),idx:0,graded:{},right:0,wrong:0,mistakes:[],state:null};
      render();break}
    case 'say':{const it=s.q[s.idx];playWord(it.lid,it.wid);break}
    case 'sayalt':{const it=s.q[s.idx];playWord(it.lid,it.wid,v);break}
    case 'playw':actx();playWord(b.dataset.l,b.dataset.w,b.dataset.which);break;
    case 'recmenu':recMenu(v);break;
    case 'recstart':startRec();break;
    case 'recstop':stopRec();break;
    case 'reccancel':{const st=s.state;st.cancel=true;st.rec='idle';st.slow=false;render();toast('Abgebrochen – läuft der Worker? (docker compose logs worker)','err');break}
    case 'playme':{const st=s&&s.state;if(st&&st.blobUrl){stopAudio();const a=new Audio(st.blobUrl);a.play().catch(e=>toast('Abspielen nicht möglich','err'))}break}
    case 'speakskip':{const st=s.state;if(!st.done){st.done=true;st.ok=false;answer(false)}render();playWord(s.q[s.idx].lid,s.q[s.idx].wid);break}
    case 'claude':sheetClaude(S.tab==='lessons'&&S.view&&S.view.lesson||null,v||null);break;
    case 'examples':sheetExamples(S.view.lesson);break;
    case 'examplesall':sheetExamplesAll();break;
    case 'meaningsall':sheetMeanings();break;
    case 'meanings':sheetMeanings(S.view.lesson);break;
    case 'addkind':S.addKind=v;render();break;
    case 'bulk':sheetBulk();break;
    case 'saveproj':{const st=set();st.claudeProject=$('#projurl').value.trim();Store.saveMeta('settings',st);toast('Gespeichert');break}
    case 'logout':Store.logout();break;
    case 'checkupdate':checkUpdate(true);break;
    case 'reveal':s.state.shown=true;render();autoSpeakAfter(s.q[s.idx]);break;
    case 'rate':answer(v!=='0',v==='1');nextItem();break;
    case 'mc':{const it=s.q[s.idx];const w=curWord(it);const st=s.state;if(st.done)break;st.pick=+v;st.done=true;st.ok=st.opts[+v]===w[st.field];answer(st.ok);render();
      const pr=it.type==='mc'?autoSpeakAfter(it):st.ok?playWord(it.lid,it.wid):null;
      // nur wenn unter „Mehr“ eingeschaltet: weiter, sobald die Stimme fertig ist, plus Lesezeit
      if(st.ok&&set().autoNext)Promise.resolve(pr).catch(()=>{}).then(()=>setTimeout(()=>{if(S.ses===s&&s.state===st)nextItem()},pr?1500:2500));break}
    case 'check':doCheck();break;
    case 'dunno':{const st=s.state;st.done=true;st.ok=false;st.input='';answer(false);render();autoSpeakAfter(s.q[s.idx]);break}
    case 'override':{const it=s.q[s.idx];const k=it.wid+it.lid;const p=prog(it.lid,it.wid);
      if(p&&!s.noSrs){p.l=Math.max(0,p.l-1);p.n=Math.max(0,p.n-1)}delete s.graded[k];s.wrong--;s.mistakes=s.mistakes.filter(m=>!(m.wid===it.wid&&m.lid===it.lid));
      const rq=s.q.findIndex((x,j)=>j>s.idx&&x.wid===it.wid&&x.lid===it.lid);if(rq>0)s.q.splice(rq,1);answer(true);s.state.ok=true;s.state.exact=true;render();break}
    case 'next':nextItem();break;
    case 'newlesson':sheetLesson(null);break;
    case 'editlesson':sheetLesson(S.view.lesson);break;
    case 'editword':sheetWord(S.view.lesson,v);break;
    case 'addto':S.addLid=S.view.lesson;S.addKind='word';S.tab='add';render();setTimeout(()=>{const e=$('#ade');e&&e.focus()},60);break;
    case 'practicelesson':{const st=set();S.setup={lids:[S.view.lesson],focus:'all',mode:st.mode,dir:st.dir,len:0};S.tab='practice';S.view=null;render();window.scrollTo(0,0);break}
    case 'setting':{const st=set();const k=b.dataset.k;st[k]=v==='true'?true:v==='false'?false:v;Store.saveMeta('settings',st);render();break}
    case 'export':doExport();break;
  }
});
function doCheck(){
  const s=S.ses,it=s.q[s.idx],w=curWord(it),st=s.state;const inp=$('#wr');const val=inp?inp.value:'';
  if(!val.trim()){inp&&inp.focus();return}
  const target=it.type==='cloze'?clozeParts(w.ex).ans:(it.type==='dict'||it.dir==='de-en')?w.en:deAll(w);
  const r=checkWritten(val,target,it.type==='cloze'||it.type==='dict'||it.dir==='de-en'?'en':'de');
  st.done=true;st.ok=r.ok;st.exact=r.exact;st.input=val;answer(r.ok);render();autoSpeakAfter(it);
}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='write')doCheck();
  if(f==='add')addWord();
  if(f==='login'){const btn=e.target.querySelector('button');btn.disabled=true;$('#lerr').textContent='';
    Store.login($('#lmail').value.trim(),$('#lpw').value).catch(err=>{btn.disabled=false;$('#lerr').textContent=err&&err.status===400?'E-Mail oder Passwort falsch.':err&&err.status===429?'Zu viele Versuche – bitte ein paar Sekunden warten und nochmal.':'Anmeldung fehlgeschlagen ('+((err&&err.status)||err)+')'})}
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.act==='pushtime')return pushTimes();
  const t=e.target;
  if(t.dataset.act==='addl'){S.addLid=t.value;return}
  if(t.dataset.act==='upload'&&t.files[0])return uploadRec(S.view.lesson,t.files[0]);
  if(t.dataset.act==='import'&&t.files[0])return importJSON(t.files[0]);
  if(t.dataset.act==='xlsx'&&t.files[0]){const f=t.files[0];t.value='';return importExcel(f)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ade'&&e.target.tagName==='INPUT'){e.preventDefault();$('#aen').focus()}
});
function addWord(){
  const de=$('#ade').value.trim(),en=$('#aen').value.trim();
  const note=S.addKind==='note';
  if(!de||!en){toast(note?(!de?'Vorderseite fehlt':'Rückseite fehlt'):!de?'Deutsch fehlt':'Englisch fehlt');(!de?$('#ade'):$('#aen')).focus();return}
  let lid=$('#addl').value;
  if(lid==='__new'){lid=newLesson(todayISO()).id}
  S.addLid=lid;const l=S.lessons[lid];
  const w={id:uid('w'),de,en};if(note)w.kind='note';const ex=$('#aex').value.trim(),no=$('#ano').value.trim();if(ex)w.ex=ex;if(no)w.note=no;
  l.words=[...(l.words||[]),w];Store.saveLesson(l);
  S.lastAdded.push({de,en,ln:l.name});
  ['ade','aen','aex','ano'].forEach(id=>$('#'+id).value='');
  render();$('#ade').focus();toast('Gespeichert in '+l.name);
}
window.addEventListener('pagehide',()=>Store.flushProgress());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){Store.flushProgress();audioStale=true;stopAudio()}else checkUpdate()});
window.addEventListener('pagehide',()=>{audioStale=true});
setTimeout(()=>checkUpdate(),3000);
if('serviceWorker' in navigator)swReg(); // nur für Erinnerungen

Store.init();
</script>
</body>
